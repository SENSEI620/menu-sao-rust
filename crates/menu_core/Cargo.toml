[package]
name = "menu_core"
version = "0.2.0"
edition = "2021"
description = "Lógica do Menu SAO (config, ajustes, navegadores, perfis do Firefox) sem nada de janela"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
