name: Compilar para Windows

# Compila o Menu SAO nos computadores do GitHub (Windows), sem você instalar nada.
# Como usar: aba "Actions" do repositório > "Compilar para Windows" > "Run workflow".
# Quando terminar, baixe o "Menu-SAO-windows" no fim da página da execução.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Testes da lógica (rodam no Windows de verdade)
        run: cargo test -p menu_core
      - name: Compilar
        run: cargo build --release -p menu-sao
      - uses: actions/upload-artifact@v4
        with:
          name: Menu-SAO-windows
          path: target/release/menu-sao.exe
