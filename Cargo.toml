[workspace]
members = ["crates/menu_core", "src-tauri"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Compilações de teste (cargo build sem --release) bem menores: só o necessário de depuração.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
